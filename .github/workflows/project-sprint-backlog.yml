# Promote Contract / UI items for started sprints from Icebox → Backlog.
# [Test] stays Icebox until UI + API are ready (manual).
#
# Secret required: PROJECT_TOKEN — PAT with Organization Projects (read/write).
name: Project sprint Backlog promote

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-sprint-backlog
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Promote Icebox to Backlog for due sprint work
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: '2'
          ORG: Capstone-Project-Team-B-2026
        run: bash .github/scripts/promote-sprint-backlog.sh
