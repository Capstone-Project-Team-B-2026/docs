# Mirror Bina-Kompetisi project built-in workflows:
# - PR mentions / links an issue → Status = In review
# - PR merged to main → Status = Done
#
# Requires repo/org secret PROJECT_TOKEN (classic PAT or fine-grained with
# Projects: read/write + Issues/PRs read). GITHUB_TOKEN alone cannot write
# org Projects V2.

name: Project status

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review, closed]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: project-status-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync issue Status on project
    if: github.event.pull_request.draft != true || github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Update project Status for mentioned / linked issues
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_ID: PVT_kwDOE85IDs4BkQL1
          STATUS_FIELD_ID: PVTSSF_lADOE85IDs4BkQL1zhjBbak
          STATUS_IN_REVIEW: a5a3e1aa
          STATUS_DONE: b00205e2
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_ACTION: ${{ github.event.action }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing secret PROJECT_TOKEN (needs project scope). Skipping."
            exit 1
          fi

          if [ "$PR_ACTION" = "closed" ] && [ "$PR_MERGED" = "true" ] && [ "$PR_BASE" = "main" ]; then
            TARGET_STATUS="$STATUS_DONE"
            TARGET_NAME="Done"
          elif [ "$PR_ACTION" = "closed" ]; then
            echo "PR closed without merge to main — no status change."
            exit 0
          else
            TARGET_STATUS="$STATUS_IN_REVIEW"
            TARGET_NAME="In review"
          fi

          echo "Target Status: $TARGET_NAME ($TARGET_STATUS)"

          # Linked issues (closing keywords / Development sidebar) + #N mentions in title/body
          ISSUES_JSON=$(gh api graphql -f query='
            query($owner:String!, $name:String!, $number:Int!) {
              repository(owner:$owner, name:$name) {
                pullRequest(number:$number) {
                  title
                  body
                  closingIssuesReferences(first: 50) {
                    nodes { id number repository { nameWithOwner } }
                  }
                }
              }
            }' \
            -f owner="${REPO%/*}" \
            -f name="${REPO#*/}" \
            -F number="$PR_NUMBER")

          TITLE=$(echo "$ISSUES_JSON" | jq -r '.data.repository.pullRequest.title // ""')
          BODY=$(echo "$ISSUES_JSON" | jq -r '.data.repository.pullRequest.body // ""')

          # node_ids from closingIssuesReferences (same or cross-repo)
          mapfile -t NODE_IDS < <(echo "$ISSUES_JSON" | jq -r '
            .data.repository.pullRequest.closingIssuesReferences.nodes[]? | .id
          ' | sort -u)

          # Mentions: #123 or owner/repo#123 in title+body
          TEXT="$TITLE"$'\n'"$BODY"
          while IFS= read -r mention; do
            [ -z "$mention" ] && continue
            if [[ "$mention" == *"#"* && "$mention" == *"/"* ]]; then
              owner_repo="${mention%#*}"
              num="${mention##*#}"
              owner="${owner_repo%/*}"
              name="${owner_repo#*/}"
            else
              owner="${REPO%/*}"
              name="${REPO#*/}"
              num="${mention#\#}"
            fi
            nid=$(gh api "repos/$owner/$name/issues/$num" --jq .node_id 2>/dev/null || true)
            if [ -n "${nid:-}" ]; then
              NODE_IDS+=("$nid")
            fi
          done < <(echo "$TEXT" | grep -oE '([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+' | sort -u)

          # Dedupe
          mapfile -t NODE_IDS < <(printf '%s\n' "${NODE_IDS[@]:-}" | awk 'NF' | sort -u)

          if [ "${#NODE_IDS[@]}" -eq 0 ]; then
            echo "No linked/mentioned issues on PR #$PR_NUMBER."
            exit 0
          fi

          echo "Issues to update: ${#NODE_IDS[@]}"

          for CONTENT_ID in "${NODE_IDS[@]}"; do
            ITEM_ID=$(gh api graphql -f query='
              mutation($project:ID!, $content:ID!) {
                addProjectV2ItemById(input: {projectId: $project, contentId: $content}) {
                  item { id }
                }
              }' -f project="$PROJECT_ID" -f content="$CONTENT_ID" \
              --jq '.data.addProjectV2ItemById.item.id' 2>/dev/null || true)

            # If already on project, add returns the existing item; if mutation fails, look up
            if [ -z "${ITEM_ID:-}" ] || [ "$ITEM_ID" = "null" ]; then
              ITEM_ID=$(gh api graphql -f query='
                query($id:ID!) {
                  node(id:$id) {
                    ... on Issue {
                      projectItems(first: 20) {
                        nodes {
                          id
                          project { id }
                        }
                      }
                    }
                  }
                }' -f id="$CONTENT_ID" \
                --jq --arg pid "$PROJECT_ID" '
                  .data.node.projectItems.nodes[]
                  | select(.project.id == $pid)
                  | .id
                ' | head -n1)
            fi

            if [ -z "${ITEM_ID:-}" ] || [ "$ITEM_ID" = "null" ]; then
              echo "!! could not resolve project item for $CONTENT_ID"
              continue
            fi

            gh api graphql -f query='
              mutation($project:ID!, $item:ID!, $field:ID!, $option:String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project
                  itemId: $item
                  fieldId: $field
                  value: { singleSelectOptionId: $option }
                }) {
                  projectV2Item { id }
                }
              }' \
              -f project="$PROJECT_ID" \
              -f item="$ITEM_ID" \
              -f field="$STATUS_FIELD_ID" \
              -f option="$TARGET_STATUS" \
              --jq '.data.updateProjectV2ItemFieldValue.projectV2Item.id' >/dev/null

            echo "✓ $CONTENT_ID → $TARGET_NAME (item $ITEM_ID)"
          done
